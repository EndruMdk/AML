<!DOCTYPE html>
<!-- Andrija Trnavcevic -->
<html>
<head>
    <meta charset="UTF-8" />
    <title>Aura Registracija</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f4;
            color: black;
        }

        .page {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 14px;
            padding: 24px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b6b6b;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #6b6b6b;
            margin-bottom: 6px;
            display: block;
        }

        .input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 10px;
            background: #f5f5f4;
            font-size: 14px;
            color: black;
            outline: none;
        }

        .input:focus {
            border-color: #BB00BB;
            background: white;
        }

        .role-title {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #6b6b6b;
            margin: 20px 0 10px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 10px 0;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: black;
        }

        .radio-option input[type="radio"] {
            accent-color: #BB00BB;
            cursor: pointer;
        }

        .cv-upload {
            display: none;
            margin-bottom: 20px;
        }

        .file-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 10px;
            background: #f5f5f4;
            font-size: 14px;
            color: black;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: #f5f5f4;
            color: black;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn:hover {
            border-color: #BB00BB;
        }

        .btn.primary {
            background: rgba(187, 0, 187, 0.07);
            border: 1px solid rgba(187, 0, 187, 0.4);
            color: #BB00BB;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="card">
            <h1 class="title">Registracija</h1>
            <p class="subtitle">Napravite svoj nalog</p>

            <form onsubmit="goToPage(event)">
                <div class="input-group">
                    <label class="label">Ime</label>
                    <input class="input" type="text" placeholder="Unesite ime" required/>
                </div>

                <div class="input-group">
                    <label class="label">Prezime</label>
                    <input class="input" type="text" placeholder="Unesite prezime" required/>
                </div>

                <div class="input-group">
                    <label class="label">Mail</label>
                    <input class="input" type="email" placeholder="Unesite email" required/>
                </div>

                <div class="input-group">
                    <label class="label">Username</label>
                    <input class="input" type="text" placeholder="Unesite username" required/>
                </div>

                <div class="input-group">
                    <label class="label">Lozinka</label>
                    <input class="input" type="password" placeholder="Unesite lozinku" required/>
                </div>

                <p class="role-title">Izaberite tip korisnika</p>

                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="uloga" value="korisnik" checked onchange="toggleCV()" />
                        Korisnik
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="uloga" value="arbitrator" onchange="toggleCV()" />
                        Arbitrator
                    </label>
                </div>

                <div class="cv-upload" id="cvUpload">
                    <label class="label">CV (PDF)</label>
                    <input class="file-input" type="file" accept=".pdf,application/pdf"/>
                </div>

                <div class="actions">
                    <button type="submit" class="btn primary">Registracija</button>                    <button type="button" class="btn" onclick="window.location.href='index.html'">Povratak na login</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleCV() {
            const arbitrator = document.querySelector('input[value="arbitrator"]');
            const cvUpload = document.getElementById("cvUpload");

            if (arbitrator.checked) {
                cvUpload.style.display = "block";
            } else {
                cvUpload.style.display = "none";
            }
        }

        function goToPage(event) {
            event.preventDefault();
            const selected = document.querySelector('input[name="uloga"]:checked');

            if (selected.value === "korisnik") {
                window.location.href = "regKorisnik.html";
            } else if (selected.value === "arbitrator") {
                window.location.href = "regArbitrator.html";
            }
        }
    </script>
</body>
</html>
