<!DOCTYPE html>
<html>
<!-- Andrija Trnavcevic -->
<head>
    <meta charset="UTF-8" />
    <title>Statistika korisnika</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f4;
            color: black;
        }

        .page {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 820px;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 14px;
            padding: 24px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b6b6b;
            margin-bottom: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 50% 50%;
            gap: 16px;
            margin-bottom: 16px;
        }

        .stat-box {
            background: #f5f5f4;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 12px;
            padding: 20px;
            min-height: 170px;
        }

        .wide-box {
            background: #f5f5f4;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .box-title {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #6b6b6b;
            margin-bottom: 16px;
        }

        .main-value {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #BB00BB;
        }

        .sub-value {
            font-size: 15px;
            color: black;
            margin-bottom: 6px;
        }

        .muted {
            color: #6b6b6b;
            font-size: 14px;
        }

        .chart {
            width: 100%;
            height: 260px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 8px 4px;
            border-radius: 10px;
        }

        .bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .bar {
            width: 100%;
            max-width: 70px;
            background: rgba(187, 0, 187, 0.2);
            border: 1px solid rgba(187, 0, 187, 0.4);
            border-radius: 10px 10px 0 0;
        }

        .bar-label {
            font-size: 13px;
            color: #6b6b6b;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: #f5f5f4;
            color: black;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn:hover {
            border-color: #BB00BB;
        }

        .btn.primary {
            background: rgba(187, 0, 187, 0.07);
            border: 1px solid rgba(187, 0, 187, 0.4);
            color: #BB00BB;
        }

        
    </style>
</head>

<body>
    <div class="page">
        <div class="card">
            <h1 class="title">Statistika korisnika</h1>
            <p class="subtitle">Pregled uspešnosti glasanja i stanja novčanika</p>

            <div class="stats-grid">
                <div class="stat-box">
                    <p class="box-title">Uspešnost glasanja</p>
                    <div class="main-value">97 pogođenih glasanja</div>
                    <p class="sub-value">Ukupan broj glasanja</p>
                    <p class="sub-value">128</p>
                    <p class="muted">Procenat uspešnosti: 75.8%</p>
                </div>

                <div class="stat-box">
                    <p class="box-title">Finansijski rezultat</p>
                    <div class="main-value">+2450 AC</div>
                    <p class="sub-value">Ukupan dobitak/gubitak</p>
                    <p class="muted">Valuta: AuraCoin</p>
                </div>
            </div>

            <div class="actions">
                <button class="btn primary" onclick="window.location.href='korisnickiProfil.html'">
                    Povratak na profil
                </button>
            </div>
        </div>
    </div>
</body>
</html>
