
<div style="display:flex;justify-content:center;padding:1rem 0;">
<div style="width:375px;background:#ffffff;border:0.5px solid #e0e0e0;border-radius:16px;overflow:hidden;font-family:var(--font-sans);position:relative;">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:0.5px solid #e0e0e0;">
    <span style="font-size:15px;font-weight:500;color:#111;">Banovanje korisnika</span>
    <div style="width:36px;height:36px;border-radius:50%;background:#BB00BB22;border:0.5px solid #BB00BB55;display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <circle cx="9" cy="7" r="3" stroke="#BB00BB" stroke-width="1.3"/>
        <path d="M3 16c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="#BB00BB" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div style="padding:10px 16px;border-bottom:0.5px solid #e0e0e0;display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;align-items:center;background:#f5f5f5;border:0.5px solid #e0e0e0;border-radius:8px;padding:7px 12px;gap:8px;">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="opacity:0.4;flex-shrink:0;">
        <circle cx="7" cy="7" r="4.5" stroke="#333" stroke-width="1.2"/>
        <line x1="10.5" y1="10.5" x2="14" y2="14" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <input type="text" placeholder="Pretraži korisnike..." style="border:none;background:transparent;outline:none;font-size:14px;color:#333;width:100%;font-family:var(--font-sans);"/>
    </div>
    <div style="display:flex;gap:8px;">
      <button id="tab-arb" onclick="switchTab('arb')" style="flex:1;padding:7px 0;background:#BB00BB18;border:0.5px solid #BB00BB44;border-radius:8px;font-size:13px;font-weight:500;color:#BB00BB;cursor:pointer;">Arbitratori</button>
      <button id="tab-usr" onclick="switchTab('usr')" style="flex:1;padding:7px 0;background:#f5f5f5;border:0.5px solid #e0e0e0;border-radius:8px;font-size:13px;font-weight:500;color:#888;cursor:pointer;">Korisnici</button>
    </div>
  </div>

  <div style="min-height:460px;">
    <div id="list-arb" style="padding:4px 0;">
      <div style="display:flex;align-items:center;padding:10px 16px;gap:12px;border-bottom:0.5px solid #f0f0f0;">
        <div style="width:36px;height:36px;border-radius:50%;background:#BB00BB18;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#BB00BB;flex-shrink:0;">MP</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:500;color:#111;">marko_petrovic</div>
          <div style="font-size:12px;color:#aaa;">Aktivan · Arbitrator</div>
        </div>
        <button onclick="showConfirm('marko_petrovic',this)" style="padding:5px 12px;background:#FCEBEB;border:1px solid #F09595;border-radius:6px;font-size:12px;font-weight:500;color:#A32D2D;cursor:pointer;">Ban</button>
      </div>
      <div style="display:flex;align-items:center;padding:10px 16px;gap:12px;">
        <div style="width:36px;height:36px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#aaa;flex-shrink:0;">JN</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:500;color:#aaa;">jovana_nikolic</div>
          <div style="font-size:12px;color:#ccc;">Banovano · Arbitrator</div>
        </div>
        <button style="padding:5px 12px;background:#f5f5f5;border:0.5px solid #e0e0e0;border-radius:6px;font-size:12px;color:#ccc;cursor:not-allowed;" disabled>Ban</button>
      </div>
    </div>

    <div id="list-usr" style="padding:4px 0;display:none;">
      <div style="display:flex;align-items:center;padding:10px 16px;gap:12px;border-bottom:0.5px solid #f0f0f0;">
        <div style="width:36px;height:36px;border-radius:50%;background:#BB00BB18;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#BB00BB;flex-shrink:0;">SJ</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:500;color:#111;">stefan_jovic</div>
          <div style="font-size:12px;color:#aaa;">Aktivan · Korisnik</div>
        </div>
        <button onclick="showConfirm('stefan_jovic',this)" style="padding:5px 12px;background:#FCEBEB;border:1px solid #F09595;border-radius:6px;font-size:12px;font-weight:500;color:#A32D2D;cursor:pointer;">Ban</button>
      </div>
      <div style="display:flex;align-items:center;padding:10px 16px;gap:12px;">
        <div style="width:36px;height:36px;border-radius:50%;background:#BB00BB18;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#BB00BB;flex-shrink:0;">AM</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:500;color:#111;">ana_markovic</div>
          <div style="font-size:12px;color:#aaa;">Aktivan · Korisnik</div>
        </div>
        <button onclick="showConfirm('ana_markovic',this)" style="padding:5px 12px;background:#FCEBEB;border:1px solid #F09595;border-radius:6px;font-size:12px;font-weight:500;color:#A32D2D;cursor:pointer;">Ban</button>
      </div>
    </div>
  </div>

  <div id="confirm-overlay" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,0.35);border-radius:16px;align-items:flex-end;justify-content:center;">
    <div style="width:100%;background:#fff;border-radius:16px 16px 0 0;padding:24px 20px 28px;">
      <div style="width:36px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 20px;"></div>
      <div style="width:48px;height:48px;border-radius:50%;background:#FCEBEB;border:1px solid #F09595;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 6v5M10 13.5v.5" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="10" cy="10" r="8" stroke="#A32D2D" stroke-width="1.3"/>
        </svg>
      </div>
      <p style="text-align:center;font-size:15px;font-weight:500;color:#111;margin:0 0 6px;">Deaktiviraj nalog?</p>
      <p id="confirm-username" style="text-align:center;font-size:13px;color:#888;margin:0 0 24px;"></p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <button onclick="cancelBan()" style="padding:12px 0;background:#f5f5f5;border:0.5px solid #e0e0e0;border-radius:8px;font-size:14px;font-weight:500;color:#555;cursor:pointer;">Otkaži</button>
        <button onclick="confirmBan()" style="padding:12px 0;background:#FCEBEB;border:1px solid #F09595;border-radius:8px;font-size:14px;font-weight:500;color:#A32D2D;cursor:pointer;">Deaktiviraj</button>
      </div>
    </div>
  </div>

</div>
</div>

<script>
var pendingBtn = null;

function switchTab(tab) {
  var isArb = tab === 'arb';
  document.getElementById('list-arb').style.display = isArb ? 'block' : 'none';
  document.getElementById('list-usr').style.display = isArb ? 'none' : 'block';
  var tabArb = document.getElementById('tab-arb');
  var tabUsr = document.getElementById('tab-usr');
  tabArb.style.background = isArb ? '#BB00BB18' : '#f5f5f5';
  tabArb.style.borderColor = isArb ? '#BB00BB44' : '#e0e0e0';
  tabArb.style.color = isArb ? '#BB00BB' : '#888';
  tabUsr.style.background = isArb ? '#f5f5f5' : '#BB00BB18';
  tabUsr.style.borderColor = isArb ? '#e0e0e0' : '#BB00BB44';
  tabUsr.style.color = isArb ? '#888' : '#BB00BB';
}

function showConfirm(username, btn) {
  pendingBtn = btn;
  document.getElementById('confirm-username').textContent = '@' + username;
  document.getElementById('confirm-overlay').style.display = 'flex';
}

function cancelBan() {
  document.getElementById('confirm-overlay').style.display = 'none';
  pendingBtn = null;
}

function confirmBan() {
  document.getElementById('confirm-overlay').style.display = 'none';
  if (!pendingBtn) return;
  var row = pendingBtn.parentElement;
  var avatar = row.querySelector('div[style*="border-radius:50%"]');
  var nameEl = row.querySelector('div[style*="font-size:14px"]');
  var statusEl = row.querySelector('div[style*="font-size:12px"]');
  var role = statusEl.textContent.includes('Arbitrator') ? 'Arbitrator' : 'Korisnik';
  avatar.style.background = '#f0f0f0';
  avatar.style.color = '#aaa';
  nameEl.style.color = '#aaa';
  statusEl.textContent = 'Banovano · ' + role;
  statusEl.style.color = '#ccc';
  pendingBtn.style.background = '#f5f5f5';
  pendingBtn.style.border = '0.5px solid #e0e0e0';
  pendingBtn.style.color = '#ccc';
  pendingBtn.style.cursor = 'not-allowed';
  pendingBtn.disabled = true;
  pendingBtn.onclick = null;
  pendingBtn = null;
}
</script>
