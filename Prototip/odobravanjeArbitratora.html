<!DOCTYPE html>
<!-- Andrija Trnavcevic -->
<html>
<head>
    <meta charset="UTF-8" />
    <title>Odobravanje arbitratora</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f4;
            color: black;
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .topbar {
            margin-bottom: 24px;
        }

        .btn-back {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: white;
            color: black;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-back:hover {
            border-color: #BB00BB;
        }

        .title {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b6b6b;
            margin-bottom: 24px;
        }

        .applications {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .application-card {
            display: flex;
            gap: 16px;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 14px;
            padding: 20px;
        }

        .card-content {
            flex: 1;
        }

        .section-title {
            font-size: 12px;
            color: #6b6b6b;
            margin-bottom: 12px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 50% 50%;
            gap: 10px;
            margin-bottom: 16px;
        }

        .info-box {
            background: #f5f5f4;
            padding: 10px;
            border-radius: 8px;
        }

        .label {
            font-size: 11px;
            color: #6b6b6b;
        }

        .value {
            font-size: 14px;
        }

        .pdf-box {
            background: #f5f5f4;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed rgba(0, 0, 0, 0.12);
        }

        .card-actions {
            width: 100px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            padding: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .approve {
            background: rgba(31, 157, 85, 0.2);
            color: #1f9d55;
        }

        .reject {
            background: rgba(214, 69, 69, 0.2);
            color: #d64545;
        }
    </style>
</head>

<body>
    <div class="page">

        <div class="topbar">
            <button class="btn-back" onclick="window.location.href='adminProfil.html'">Povratak na početnu</button>
        </div>

        <h1 class="title">Prijave za arbitratore</h1>
        <p class="subtitle">Admin pregleda prijave</p>

        <div class="applications">

            <div class="application-card">
                <div class="card-content">
                    <p class="section-title">Prijava 1</p>

                    <div class="info-grid">
                        <div class="info-box">
                            <p class="label">Ime</p>
                            <p class="value">Marko</p>
                        </div>

                        <div class="info-box">
                            <p class="label">Prezime</p>
                            <p class="value">Marković</p>
                        </div>

                        <div class="info-box">
                            <p class="label">Email</p>
                            <p class="value">marko@gmail.com</p>
                        </div>

                        <div class="info-box">
                            <p class="label">Username</p>
                            <p class="value">marko123</p>
                        </div>
                    </div>

                    <div class="pdf-box">
                        CV.pdf (nije implementirano)
                    </div>
                </div>

                <div class="card-actions">
                    <button class="action-btn approve" onclick="handleDecision(this,'approve')">DA</button>
                    <button class="action-btn reject" onclick="handleDecision(this,'reject')">NE</button>
                </div>
            </div>

            <div class="application-card">
                <div class="card-content">
                    <p class="section-title">Prijava 2</p>

                    <div class="info-grid">
                        <div class="info-box">
                            <p class="label">Ime</p>
                            <p class="value">Jelena</p>
                        </div>

                        <div class="info-box">
                            <p class="label">Prezime</p>
                            <p class="value">Jovanović</p>
                        </div>

                        <div class="info-box">
                            <p class="label">Email</p>
                            <p class="value">jelena@gmail.com</p>
                        </div>

                        <div class="info-box">
                            <p class="label">Username</p>
                            <p class="value">jeca</p>
                        </div>
                    </div>

                    <div class="pdf-box">
                        CV.pdf (nije implementirano)
                    </div>
                </div>

                <div class="card-actions">
                    <button class="action-btn approve" onclick="handleDecision(this,'approve')">DA</button>
                    <button class="action-btn reject" onclick="handleDecision(this,'reject')">NE</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function handleDecision(button, decision) {
            const card = button.closest(".application-card");
            const buttons = card.querySelectorAll(".action-btn");

            if (decision === "approve") {
                card.style.background = "rgba(31,157,85,0.1)";
            } else {
                card.style.background = "rgba(214,69,69,0.1)";
            }

            buttons.forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = "0.5";
            });
        }
    </script>

</body>
</html>
