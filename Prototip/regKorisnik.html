<!DOCTYPE html>
<!-- Mihailo Mandic -->
<html>
<head>
    <meta charset="UTF-8" />
    <title>Uspešna registracija</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f4;
            color: black;
        }

        .page {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 14px;
            padding: 24px;
            text-align: center;
        }

        .title {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b6b6b;
            margin-bottom: 24px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: #f5f5f4;
            font-size: 14px;
            cursor: pointer;
        }

        .btn:hover {
            border-color: #BB00BB;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="card">
            <h1 class="title">Uspešna registracija</h1>
            <p class="subtitle">Vaš nalog je uspešno kreiran.</p>

            <button class="btn" onclick="window.location.href='index.html'">
                Login
            </button>
        </div>
    </div>
</body>
</html>
