<!DOCTYPE html>
<html>
<!-- Andrija Trnavcevic -->
<head>
    <meta charset="UTF-8" />
    <title>Korisnički profil</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f4;
            color: black;
        }

        .page {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 14px;
            padding: 24px;
            text-align: center;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: #f5f5f4;
            color: black;
            font-size: 14px;
            cursor: pointer;
        }

        .btn:hover {
            border-color: #BB00BB;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="card">
            <h1 class="title">Korisnički profil</h1>

            <div class="buttons">
                <button class="btn" onclick="window.location.href='wallet.html'">Wallet</button>
                <button class="btn" onclick="window.location.href='tema.html'">Promena tema</button>
                <button class="btn" onclick="window.location.href='istorijaGlasanja.html'">Istorija glasanja</button>
                <button class="btn" onclick="window.location.href='statistikaKorisnika.html'">Moja Statistika</button>
                <button class="btn" onclick="window.location.href='AML_Prototype_Feed.html'">Feed</button>
                <button class="btn" onclick="window.location.href='index.html'">Logout</button>
            </div>
        </div>
    </div>
</body>
</html>
