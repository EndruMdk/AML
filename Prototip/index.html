<!DOCTYPE html>
<html lang="en">
<!-- Mihailo Mandic -->
<head>
    <meta charset="UTF-8" />
    <title>Aura Login</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f4;
            color: black;
        }

        .page {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 14px;
            padding: 24px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b6b6b;
            margin-bottom: 24px;
        }

        .label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #6b6b6b;
            margin-bottom: 6px;
            display: block;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 10px;
            background: #f5f5f4;
            font-size: 14px;
            color: black;
            outline: none;
        }

        .input:focus {
            border-color: #BB00BB;
            background: white;
        }

        .role-title {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #6b6b6b;
            margin: 20px 0 10px;
        }

        .role-buttons {
            display: grid;
            grid-template-columns: 100%;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.12);
            background: #f5f5f4;
            color: black;
            font-size: 14px;
            cursor: pointer;
        }

        .btn:hover {
            border-color: #BB00BB;
        }

        .btn.primary {
            background: rgba(187, 0, 187, 0.07);
            border: 1px solid rgba(187, 0, 187, 0.4);
            color: #BB00BB;
        }

        .create-account {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="card">
            <h1 class="title">Login</h1>
            <p class="subtitle">Prijavite se na svoj nalog</p>

            <div class="input-group">
                <label class="label">Username</label>
                <input class="input" type="text" placeholder="Unesite username" />
            </div>

            <div class="input-group">
                <label class="label">Lozinka</label>
                <input class="input" type="password" placeholder="Unesite lozinku" />
            </div>

            <p class="role-title">Izaberite tip korisnika</p>

            <div class="role-buttons">
                <button class="btn primary" onclick="goToPage('user')">Korisnik</button>
                <button class="btn" onclick="goToPage('arbitrator')">Arbitrator</button>
                <button class="btn" onclick="goToPage('admin')">Admin</button>
            </div>

            <div class="create-account">
                <button class="btn" onclick="window.location.href='registracija.html'">
                    Nemate nalog? Napravi nalog
                </button>
            </div>
        </div>
    </div>

    <script>
        function goToPage(role) {
            if (role === "user") {
                window.location.href = "AML_Prototype_Feed.html";
            } else if (role === "arbitrator") {
                window.location.href = "arbitratorProfil.html";
            } else if (role === "admin") {
                window.location.href = "adminProfil.html";
            }
        }
    </script>
</body>
</html>
